---
# BROUILLON — non testé, aucun accès vCenter/vSphere disponible pour valider ce fichier
# actuellement. À copier dans le repo Gitea homelab-playbooks (ex: vmware/create-vm.yml)
# et à vérifier manuellement sur un vrai vCenter avant tout usage réel.
#
# Objectif : créer une VM sur vCenter (clone depuis template) via Ansible plutôt que
# Terraform, pour cette raison précise (demande utilisateur) : garder un seul outil qui
# fait à la fois la création ET le post-install, au lieu de mélanger Terraform (création)
# + Ansible (post-install) comme c'est fait aujourd'hui côté Proxmox.
#
# Variables attendues (-e ou vars_files) :
#   vcenter_hostname, vcenter_username, vcenter_password   — connexion vCenter
#   vcenter_datacenter, vcenter_cluster, vcenter_datastore, vcenter_folder
#   template_name        — template à cloner (image cloud Linux, ou Windows prêt pour sysprep)
#   vm_name, vm_cpu, vm_memory_mb, vm_disk_gb
#   network_name          — port group / réseau vSphere cible
#   ip_address, netmask, gateway, dns_servers   — personnalisation réseau de l'invité
#   os_type                — "linux" ou "windows", pilote la suite du pipeline (voir plus
#     bas — pas géré dans ce fichier, juste la création)
#   domain_name, domain_admin_user, domain_admin_password   — uniquement si on veut
#     joindre le domaine AD directement à la création (sysprep Windows) ; sinon laisser
#     vide et joindre le domaine après coup via un playbook dédié (join-ad.yml, déjà
#     prévu au catalogue pour le pendant Proxmox/Linux).
#
# C'est l'équivalent Ansible de ce que fait à la main la "Spécification de
# personnalisation d'OS invité" dans vCenter (Raccourcis > Stratégies et profils) : ici
# défini en code à chaque exécution plutôt que via un profil nommé réutilisable dans
# l'interface vCenter — mêmes réglages (réseau, hostname, jonction de domaine), juste pas
# stockés comme objet vCenter séparé.
#
# Dépendances côté contrôleur Ansible (worker/backend) :
#   - collection community.vmware (à ajouter dans requirements.yml du repo Gitea)
#   - paquet Python pyvmomi (ajouté à backend/requirements.txt de l'app)

- name: Provisionner une VM sur vCenter (clone template + personnalisation invité)
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    vm_disk_gb: 40
    vm_cpu: 2
    vm_memory_mb: 4096

  tasks:
    - name: Clone du template + personnalisation réseau (et domaine si Windows)
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false          # labo interne, certificat auto-signé
        datacenter: "{{ vcenter_datacenter }}"
        cluster: "{{ vcenter_cluster }}"
        folder: "{{ vcenter_folder }}"
        name: "{{ vm_name }}"
        template: "{{ template_name }}"
        state: poweredon
        wait_for_ip_address: true
        hardware:
          num_cpus: "{{ vm_cpu }}"
          memory_mb: "{{ vm_memory_mb }}"
        disk:
          - size_gb: "{{ vm_disk_gb }}"
            type: thin
            datastore: "{{ vcenter_datastore }}"
        networks:
          - name: "{{ network_name }}"
            type: static
            ip: "{{ ip_address }}"
            netmask: "{{ netmask }}"
            gateway: "{{ gateway }}"
            dns_servers: "{{ dns_servers }}"
        customization:
          hostname: "{{ vm_name }}"
          dns_servers: "{{ dns_servers }}"
          domain: "{{ domain_name | default(omit) }}"
          # Sysprep Windows uniquement — ignoré côté Linux (os_type != 'windows').
          joindomain: "{{ domain_name if (os_type == 'windows' and domain_name is defined) else omit }}"
          domainadmin: "{{ domain_admin_user | default(omit) }}"
          domainadminpassword: "{{ domain_admin_password | default(omit) }}"
      register: create_result

    - name: Adresse IP obtenue de VMware Tools
      debug:
        msg: >-
          VM {{ vm_name }} créée — IP :
          {{ create_result.instance.ipv4 | default('inconnue, VMware Tools pas encore remontés') }}
