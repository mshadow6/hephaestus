services:
  postgres:
    image: postgres:16-alpine
    container_name: vmprov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vmprov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vmprov}
      POSTGRES_DB: ${POSTGRES_DB:-vmprovisioning}
    # Pas de "ports:" ici volontairement — atteignable seulement depuis les autres
    # conteneurs du réseau docker-compose (par leur nom DNS interne "postgres"), jamais
    # depuis l'hôte ou le LAN. Exposer une base de données directement sur le réseau est
    # une surface d'attaque inutile (trouvé en revue de sécurité : n'importe qui sur le
    # LAN pouvait tenter de s'y connecter).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmprov}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vmprov-redis
    restart: unless-stopped
    # Pas de "ports:" ici volontairement (même raison que postgres) — et surtout : sans
    # mot de passe, Redis en accès réseau direct exposait toute la file de jobs RQ (y
    # compris, en transit, le mot de passe root éphémère généré pour le bootstrap Ansible
    # de chaque VM) à n'importe qui sur le LAN, et permettait en théorie d'y injecter des
    # jobs arbitraires exécutés par le worker (trouvé en revue de sécurité).
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requis dans .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requis dans .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vmprov-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vmprov}:${POSTGRES_PASSWORD:-vmprov}@postgres:5432/${POSTGRES_DB:-vmprovisioning}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./config:/app/config:z
      - ./.secrets:/app/.secrets:ro
      - ansible_playbooks:/app/ansible-playbooks:ro
      - tls_certs:/data/tls
      - audit_logs:/app/logs
    # Pas de "ports:" ici volontairement — tout passe par Caddy (seul point d'entrée
    # HTTP/HTTPS, en-têtes de sécurité, redirection TLS). Exposer aussi le backend en
    # direct sur 8000 permettait de contourner Caddy entièrement : pas de HTTPS, pas des
    # en-têtes de sécurité, et surtout un en-tête X-Forwarded-For falsifiable à volonté
    # (le journal d'audit se fie à cet en-tête pour l'IP réelle — trouvé en revue de
    # sécurité).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: vmprov-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vmprov}:${POSTGRES_PASSWORD:-vmprov}@postgres:5432/${POSTGRES_DB:-vmprovisioning}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TF_PLUGIN_CACHE_DIR: /app/.terraform.d/plugin-cache
    volumes:
      - ./terraform:/app/terraform:ro
      - terraform_runs:/app/terraform-runs
      - terraform_plugin_cache:/app/.terraform.d/plugin-cache
      - ./.secrets:/app/.secrets:ro
      - ansible_playbooks:/app/ansible-playbooks
      - ./config:/app/config:z
    command: python worker.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    container_name: vmprov-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Pas de port publié pour 2019 (API d'admin) — volontairement, voir Caddyfile.
      # Reste joignable uniquement depuis les autres conteneurs du réseau interne.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - tls_certs:/data/tls:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  terraform_runs:
  terraform_plugin_cache:
  ansible_playbooks:
  tls_certs:
  audit_logs:
