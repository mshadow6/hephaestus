{% extends "base.html" %}
{% block title %}Nouvelle connexion — Hephaestus{% endblock %}
{% block content %}
<a class="back-link" href="/connections">&larr; Retour aux connexions</a>

<div class="card">
  <h3>Quel type de connexion veux-tu ajouter ?</h3>
  <div class="type-picker category-picker">
    {% for key, label in categories %}
    <a class="category-card" href="/connections/new?category={{ key }}">
      <span class="category-card-label">{{ label }}</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
