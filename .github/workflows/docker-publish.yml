name: Publier l'image Docker sur GHCR

# backend/ et worker partagent le même Dockerfile (juste une commande de démarrage
# différente, voir docker-compose.yml) - une seule image construite et poussée, les deux
# services la réutilisent côté utilisateur final (docker-compose.prebuilt.yml).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Déterminer les tags d'image
        id: vars
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "${{ env.IMAGE_NAME }}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
            echo "${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
